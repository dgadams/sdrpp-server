# sdrpp server
# server to allow sdrpp connections to sdrplay and rtl-sdr devices
# Note: init is enabled since sdrpp forks sdrplay.
#
# D. G. Adams 2026-Nov-01
#
name: sdrpp-server
services:
  sdrpp-server:
    container_name: sdrpp-server
    image: dgadams/sdrpp-server
    restart: unless-stopped
    init: true
    devices:
      - /dev/bus/usb
    ports:
      - 5259:5259
    volumes:
      - /home/doug/.sdr++:/sdrpp/conf.d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: timeout 2 nc host.docker.internal 5259 || [ $$? -eq 143 ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
